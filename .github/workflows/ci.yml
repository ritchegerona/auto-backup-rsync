name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Install shellcheck (macOS)
        if: runner.os == 'macOS'
        run: brew install shellcheck

      - name: Bash syntax check
        run: bash -n bin/*.sh install/*.sh test/run_tests.sh

      - name: Shellcheck
        run: shellcheck bin/backup.sh bin/backup-lib.sh install/install.sh install/uninstall.sh test/run_tests.sh

      - name: Run tests
        run: bash test/run_tests.sh