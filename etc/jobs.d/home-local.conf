# Example job: local directory -> local destination (internal disk, USB drive).
# Copy/rename to a file in jobs.d/ and adjust the values below.

SOURCE="$HOME/Documents"        # source path (trailing-slash semantics applied automatically)
# SOURCES=("$HOME/Documents" "$HOME/Pictures")   # ...or an array of sources
DEST=/Volumes/Backup/personal    # local or mounted destination

EXCLUDES=(
  ".DS_Store"
  "node_modules"
  "Library/Caches"
  "*~"
)

