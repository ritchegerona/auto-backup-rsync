# Example job: local directory -> remote host over SSH (passwordless key required).
# Rsync runs over the SSH channel; retention/pruning happen over the same ssh(1) transport.

NAME="server data"
SOURCE=/srv/www                 # a local path on this machine
DEST=backup@backup.example.com:/backups/www

EXCLUDES=(
  "*.log"
  "cache/"
)

# ON_FAILURE=("curl -fsS -m 10 -H 'Title: backup failed' -d 'job www exited non-zero' ntfy.sh/YOUR-TOPIC")