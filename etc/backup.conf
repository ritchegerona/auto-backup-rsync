# auto-backup — global defaults, sourced before every job config.
# Per-job overrides live in jobs.d/*.conf and shadow these values.

# Retention policy: keep the newest snapshot per bucket, at most N buckets.
RETENTION_DAILY=7
RETENTION_WEEKLY=4
RETENTION_MONTHLY=6

# 1 = propagate source deletions to snapshots (mirror behavior). Start at 0.
USE_DELETE=0

# 1 = force checksum comparison (slower, catches files modified in place).
USE_CHECKSUM=0